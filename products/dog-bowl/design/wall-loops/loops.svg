<text x="44" y="44" class="ti">What a “loop” is, and why the paws show lines</text>
<text x="44" y="66" class="st">A loop is one lap the nozzle makes around the outline of a layer before filling the middle. Bambu calls them walls. Sections through the drum wall, seen from above.</text>
<rect x="44" y="96" width="26" height="14" fill="#c2410c"/><text x="76" y="107" class="d">outer loop (0.42 mm)</text>
<rect x="234" y="96" width="26" height="14" fill="#d9a441"/><text x="266" y="107" class="d">inner loops (0.45 mm)</text>
<rect x="444" y="96" width="26" height="14" fill="#7ba3b8"/><text x="476" y="107" class="d">sparse infill</text>
<rect x="604" y="96" width="26" height="14" fill="#b3261e" opacity="0.75"/><text x="636" y="107" class="d">no room — gap infill and squashed walls</text>
<text x="150" y="180" class="h">A · open wall, away from a paw</text>
<text x="150" y="197" class="s">4 loops each side, as configured today</text>
