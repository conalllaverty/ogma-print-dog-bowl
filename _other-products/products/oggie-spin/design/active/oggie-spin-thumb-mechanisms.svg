<text x="425" y="396" fill="#8FA0B8" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11" font-weight="400">absorbs tolerance variation</text>
<text x="425" y="434" fill="#E8EEF8" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" font-weight="600">Underside pull lip</text>
