<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120"
 viewBox="0 0 1600 1120">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#302C28"/>
  </marker>
  <marker id="lightArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#E6A84A"/>
  </marker>
  <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<style>
  svg { background:#F6F2EA; font-family:Inter,Arial,sans-serif; color:#302C28; }
  .title { font-size:36px; font-weight:750; fill:#302C28; }
  .subtitle { font-size:17px; fill:#756D64; }
  .panel { fill:#FFFDF9; stroke:#D8CFC4; stroke-width:2; }
  .panelTitle { font-size:22px; font-weight:700; fill:#302C28; }
  .number { fill:#302C28; }
  .numberText { font-size:18px; font-weight:750; fill:white; }
  .body { font-size:16px; fill:#302C28; }
  .small { font-size:13px; fill:#756D64; }
  .label { font-size:14px; font-weight:650; fill:#302C28; }
  .pass { font-size:14px; font-weight:650; fill:#4E765A; }
  .fail { font-size:14px; font-weight:650; fill:#A34E46; }
  .line { stroke:#302C28; stroke-width:2; fill:none; }
  .thin { stroke:#8C8175; stroke-width:1.4; fill:none; }
  .dim { stroke:#E6A84A; stroke-width:2; fill:none; }
  .bone { fill:#E8DDC9; stroke:#302C28; stroke-width:2; }
  .ring { fill:#E6A84A; stroke:#302C28; stroke-width:2; }
  .base { fill:#4B342D; stroke:#302C28; stroke-width:2; }
  .light { stroke:#E6A84A; stroke-width:3; fill:none; }
  .glow { fill:#FFD77A; opacity:.45; filter:url(#glow); }
</style>
<rect width="1600" height="1120" fill="#F6F2EA"/>
<text x="56" y="62" class="title" text-anchor="start">Bouclé Stack lamp — test-to-assembly guide</text>
<text x="56" y="92" class="subtitle" text-anchor="start">Final assembly starts only after Plates 1–4 and the bond proof pass.</text>
<rect x="48" y="126" width="650" height="920" rx="18" class="panel"/><circle cx="84" cy="164" r="20" class="number"/><text x="84" y="171" class="numberText" text-anchor="middle">A</text><text x="116" y="171" class="panelTitle" text-anchor="start">Exploded order — bottom to top</text><path d="M215 956 L245 875 L485 875 L515 956 L472 956 L450 913 L280 913 L258 956 Z" class="base"/><ellipse cx="365" cy="874" rx="120" ry="24" fill="#79584B" stroke="#302C28" stroke-width="2"/><text x="535" y="922" class="label" text-anchor="start">plinth + legs</text><path d="M314 826 L416 826 L416 875 L398 875 L398 885 L332 885 L332 875 L314 875 Z" fill="#79584B" stroke="#302C28" stroke-width="2"/><rect x="337" y="842" width="56" height="32" rx="5" fill="#FFF2C3" stroke="#C88A28" stroke-width="2"/><text x="535" y="853" class="label" text-anchor="start">keyed cradle + LED</text><ellipse cx="365" cy="781" rx="82" ry="18" class="bone"/><rect x="321" y="781" width="8" height="30" fill="#C9B99E"/><rect x="361" y="781" width="8" height="30" fill="#C9B99E"/><rect x="401" y="781" width="8" height="30" fill="#C9B99E"/><rect x="323" y="811" width="4" height="7" fill="#C9B99E"/><rect x="363" y="811" width="4" height="7" fill="#C9B99E"/><rect x="403" y="811" width="4" height="7" fill="#C9B99E"/><text x="535" y="788" class="label" text-anchor="start">Diffuser: engage all 3 cradle sockets</text><path d="M235 685 Q365 622 495 685 L465 760 Q365 710 265 760 Z" class="bone"/><text x="535" y="708" class="label" text-anchor="start">Shell A</text><path d="M275 580 Q365 545 455 580 L432 625 Q365 603 298 625 Z" class="ring"/><rect x="361" y="544" width="8" height="16" rx="2" class="ring"/><text x="535" y="595" class="label" text-anchor="start">A→B halo ring</text><path d="M274 458 L456 458 L480 530 Q365 560 250 530 Z" class="bone"/><text x="535" y="495" class="label" text-anchor="start">Shell B</text><path d="M292 354 Q365 326 438 354 L418 395 Q365 378 312 395 Z" class="ring"/><rect x="361" y="325" width="8" height="16" rx="2" class="ring"/><text x="535" y="370" class="label" text-anchor="start">B→C halo ring</text><path d="M292 213 L438 213 L464 302 Q365 328 266 302 Z" class="bone"/><text x="535" y="263" class="label" text-anchor="start">Shell C</text><line x1="365" y1="853" x2="365" y2="813" class="line" marker-end="url(#arrow)"/><line x1="365" y1="772" x2="365" y2="748" class="line" marker-end="url(#arrow)"/><line x1="365" y1="672" x2="365" y2="632" class="line" marker-end="url(#arrow)"/><line x1="365" y1="568" x2="365" y2="538" class="line" marker-end="url(#arrow)"/><line x1="365" y1="444" x2="365" y2="403" class="line" marker-end="url(#arrow)"/><line x1="365" y1="342" x2="365" y2="310" class="line" marker-end="url(#arrow)"/><text x="80" y="990" class="label" text-anchor="start">Orange = bonded joints. Bond Shell A to the plinth groove, not the cradle.</text><text x="80" y="1015" class="fail" text-anchor="start">Cradle stays removable through Shell A; dry-fit before any glue.</text><rect x="736" y="126" width="816" height="112" rx="16" class="panel"/><circle cx="774" cy="164" r="20" class="number"/><text x="774" y="171" class="numberText" text-anchor="middle">1</text><text x="808" y="161" class="panelTitle" text-anchor="start">Install cradle + LED</text><text x="808" y="192" class="body"><tspan x="808" dy="0">Keep the two-leg gap at the front. Confirm the 45° bore ramp is clean, align both open-</tspan><tspan x="808" dy="21">top slots beside the single rear leg, engage the opposite key, and lower the LED while</tspan><tspan x="808" dy="21">laying its lead sideways. No support material needs removal.</tspan></text><rect x="736" y="252" width="816" height="112" rx="16" class="panel"/><circle cx="774" cy="290" r="20" class="number"/><text x="774" y="297" class="numberText" text-anchor="middle">2</text><text x="808" y="287" class="panelTitle" text-anchor="start">Fit the diffuser baffle</text><text x="808" y="318" class="body"><tspan x="808" dy="0">Use the Jade White 1.2 mm part only: disc above the LED, posts toward the module. Rotate</tspan><tspan x="808" dy="21">until all three reduced pegs enter the blind cradle sockets and the Ø6 shoulders sit</tspan><tspan x="808" dy="21">flat without force or rocking. Confirm the cable remains free and the LED die is hidden</tspan><tspan x="808" dy="21">at seated eye height.</tspan></text><rect x="736" y="378" width="816" height="112" rx="16" class="panel"/><circle cx="774" cy="416" r="20" class="number"/><text x="774" y="423" class="numberText" text-anchor="middle">3</text><text x="808" y="413" class="panelTitle" text-anchor="start">Bond Shell A to the plinth</text><text x="808" y="444" class="body"><tspan x="808" dy="0">Dry-fit first: Shell A's 1.6 mm wall must drop into the 1.0 mm annular groove. Remove</tspan><tspan x="808" dy="21">the cradle and diffuser, wipe a thin epoxy film on the groove floor only, seat Shell A,</tspan><tspan x="808" dy="21">and wipe squeeze-out. Never glue the cradle flange — it must still pass through Shell A</tspan><tspan x="808" dy="21">after cure.</tspan></text><rect x="736" y="504" width="816" height="112" rx="16" class="panel"/><circle cx="774" cy="542" r="20" class="number"/><text x="774" y="549" class="numberText" text-anchor="middle">4</text><text x="808" y="539" class="panelTitle" text-anchor="start">Reinstall cradle and run the safety gate</text><text x="808" y="570" class="body"><tspan x="808" dy="0">After Shell A cures, lower the cradle and diffuser back through its opening. Power for 8</tspan><tspan x="808" dy="21">hours; PLA must stay below 45°C. Add upper-stack mass dummies and pass a 10° board test</tspan><tspan x="808" dy="21">in every direction.</tspan></text><rect x="736" y="630" width="816" height="112" rx="16" class="panel"/><circle cx="774" cy="668" r="20" class="number"/><text x="774" y="675" class="numberText" text-anchor="middle">5</text><text x="808" y="665" class="panelTitle" text-anchor="start">Bond the A→B joint</text><text x="808" y="696" class="body"><tspan x="808" dy="0">Seat the conformal skirt in Shell A, then align the tapered ring tab with Shell B's open</tspan><tspan x="808" dy="21">inner notch. Apply a thin adhesive film only to contact zones and clamp at 4.0 ±0.2 mm.</tspan></text><rect x="1330" y="646" width="182" height="34" rx="7" fill="#FFF4E2" stroke="#E6A84A"/><text x="1421" y="669" class="label" text-anchor="middle">target gap 4.0 mm</text><rect x="736" y="756" width="816" height="112" rx="16" class="panel"/><circle cx="774" cy="794" r="20" class="number"/><text x="774" y="801" class="numberText" text-anchor="middle">6</text><text x="808" y="791" class="panelTitle" text-anchor="start">Bond the B→C joint</text><text x="808" y="822" class="body"><tspan x="808" dy="0">Lower the complete 5 mm band evenly into Shell B, then align the tapered tab with Shell</tspan><tspan x="808" dy="21">C's open inner notch. Dry-seat first and keep glue out of the halo window.</tspan></text><rect x="736" y="882" width="816" height="112" rx="16" class="panel"/><circle cx="774" cy="920" r="20" class="number"/><text x="774" y="927" class="numberText" text-anchor="middle">7</text><text x="808" y="917" class="panelTitle" text-anchor="start">Final powered validation</text><text x="808" y="948" class="body"><tspan x="808" dy="0">Run 24 hours. Recheck slot widths, stability, glare, cable temperature and PLA</tspan><tspan x="808" dy="21">temperature; stop for smell, softening or colour change.</tspan></text><rect x="736" y="1016" width="816" height="50" rx="12" fill="#FCE9E5" stroke="#C87970"/><text x="758" y="1047" class="fail" text-anchor="start">Never block the cable path, glue the removable cradle, or close either halo light window.</text></svg>