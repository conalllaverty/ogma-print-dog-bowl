m</text><text x="456" y="530" class="pass" text-anchor="start">PASS  LED die hidden at seated eye height</text><text x="80" y="200" class="body" text-anchor="start">Measure each smooth lower half at 3 points.</text><text x="80" y="225" class="body" text-anchor="start">Light all sectors from the same position/exposure.</text><rect x="814" y="126" width="738" height="430" rx="18" class="panel"/><circle cx="850" cy="164" r="20" class="number"/><text x="850" y="171" class="numberText" text-anchor="middle">2</text><text x="882" y="171" class="panelTitle" text-anchor="start">A→B halo joint + Shell A base seat</text><path d="M910 474 Q1010 430 1110 474 L1096 505 Q1010 472 924 505 Z" class="bone"/><text x="1010" y="527" class="label" text-anchor="middle">Shell A rim coupon</text><path d="M930 353 Q1010 325 1090 353 L1070 390 Q1010 370 950 390 Z" class="ring"/><rect x="1006" y="326" width="8" height="16" rx="2" class="ring"/><text x="1010" y="316" class="label" text-anchor="middle">A→B halo ring</text><path d="M945 230 L1075 230 L1090 270 Q1010 285 930 270 Z" class="bone"/><text x="1010" y="258" class="label" text-anchor="middle">Shell B base coupon</text><line x1="1010" y1="285" x2="1010" y2="318" class="line" marker-end="url(#arrow)"/><line x1="1010" y1="404" x2="1010" y2="430" class="line" marker-end="url(#arrow)"/><path d="M1190 455 Q1280 420 1370 455 L1360 480 Q1280 452 1200 480 Z" class="bone"/><path d="M1210 390 Q1280 370 1350 390 L1338 425 Q1280 410 1222 425 Z" class="ring"/><path d="M1224 330 L1336 330 L1350 370 Q1280 383 1210 370 Z" class="bone"/><line x1="1377" y1="372" x2="1377" y2="421" class="dim"/><line x1="1366" y1="372" x2="1388" y2="372" class="dim"/><line x1="1366" y1="421" x2="1388" y2="421" class="dim"/><text x="1395" y="402" class="label" text-anchor="start">4.0 ±0.2 mm</text><text x="1185" y="508" class="small" text-anchor="start">measure at 3 points</text><rect x="1198" y="236" width="176" height="16" rx="3" class="base"/><path d="M1224 212 L1348 212 L1341 236 L1231 236 Z" class="bone"/><text x="1286" y="232" class="label" text-anchor="middle">Shell A base arc</text><text x="1286" y="274" class="pass" text-anchor="middle">full wall supported; no rocking</text><text x="850" y="200" class="body" text-anchor="start">Align the tapered ring tab with Shell B's inner notch; dry-fit only.</text><rect x="48" y="580" width="738" height="430" rx="18" class="panel"/><circle cx="84" cy="618" r="20" class="number"/><text x="84" y="625" class="numberText" text-anchor="middle">3</text><text x="116" y="625" class="panelTitle" text-anchor="start">B→C halo joint</text><path d="M115 928 Q240 882 365 928 L348 960 Q240 928 132 960 Z" class="bone"/><path d="M140 820 Q240 786 340 820 L315 858 Q240 836 165 858 Z" class="ring"/><rect x="236" y="787" width="8" height="16" rx="2" class="ring"/><path d="M160 720 L320 720 L342 765 Q240 786 138 765 Z" class="bone"/><line x1="240" y1="778" x2="240" y2="802" class="line" marker-end="url(#arrow)"/><line x1="240" y1="870" x2="240" y2="900" class="line" marker-end="url(#arrow)"/><text x="240" y="710" class="label" text-anchor="middle">Shell C base</text><text x="240" y="807" class="label" text-anchor="middle">B→C ring</text><text x="240" y="982" class="label" text-anchor="middle">Shell B rim</text><path d="M435 892 Q530 856 625 892 L612 918 Q530 892 448 918 Z" class="bone"/><path d="M455 832 Q530 810 605 832 L592 862 Q530 848 468 862 Z" class="ring"/><path d="M468 775 L592 775 L606 810 Q530 822 454 810 Z" class="bone"/><line x1="634" y1="812" x2="634" y2="860" class="dim"/><text x="650" y="841" class="label" text-anchor="start">4.0 ±0.2 mm</text><text x="431" y="950" class="pass" text-anchor="start">repeat all Plate 2 checks</text><text x="80" y="650" class="body" text-anchor="start">Align the tapered ring tab with Shell C's inner notch.</text><text x="80" y="675" class="fail" text-anchor="start">Use only the B→C pieces; the A→B ring is not interchangeable.</text><text x="455" y="724" class="label