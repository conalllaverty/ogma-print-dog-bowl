<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Salmon sushi fidget clicker concept</title>
  <desc id="desc">A cute 3D-printable nigiri-shaped clicker using a three-pin Outemu Blue mechanical keyboard switch. The salmon slice acts as the moving button and the smiling rice body houses the switch.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9F0"/>
      <stop offset="1" stop-color="#F6F0E7"/>
    </linearGradient>
    <linearGradient id="salmon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A82"/>
      <stop offset="0.55" stop-color="#F57766"/>
      <stop offset="1" stop-color="#E85E58"/>
    </linearGradient>
    <linearGradient id="rice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#EDE7DC"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#704B43" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#704B43" flood-opacity="0.16"/>
    </filter>
    <pattern id="grain" width="22" height="16" patternUnits="userSpaceOnUse">
      <path d="M3 8 Q7 4 11 8 Q7 12 3 8Z" fill="none" stroke="#D8D0C2" stroke-width="1" opacity="0.55"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10Z" fill="#756A65"/>
    </marker>
    <style>
      .card{fill:#FFFEFB;stroke:#E2D9CE;stroke-width:1.5}
      .ink{stroke:#3F3634;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#756A65;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke:#A89B93;stroke-width:1.5;stroke-dasharray:6 7;fill:none}
      .title{font:800 38px ui-rounded,system-ui,sans-serif;fill:#3F3634;letter-spacing:-.7px}
      .subtitle{font:500 17px system-ui,sans-serif;fill:#756A65}
      .section{font:750 20px ui-rounded,system-ui,sans-serif;fill:#3F3634}
      .label{font:650 14px system-ui,sans-serif;fill:#3F3634}
      .small{font:500 12px system-ui,sans-serif;fill:#756A65}
      .tiny{font:650 10px system-ui,sans-serif;fill:#756A65;letter-spacing:.6px}
      .dimension{stroke:#756A65;stroke-width:1.4;fill:none}
      .callout{fill:#FFF8EE;stroke:#E9C9B9;stroke-width:1.2}
      .mechanism-note{fill:#FFFEFB;fill-opacity:.94;stroke:#E2D9CE;stroke-width:1}
      .number{font:800 12px system-ui,sans-serif;fill:white}
    </style>
  </defs>

  <rect width="1400" height="1000" fill="url(#paper)"/>
  <circle cx="1270" cy="80" r="150" fill="#FFD7C9" opacity=".25"/>
  <circle cx="90" cy="925" r="185" fill="#DDE9D7" opacity=".35"/>

  <text x="54" y="62" class="title">Happy Salmon Nigiri Clicker</text>
  <text x="55" y="92" class="subtitle">Pocket-size fidget concept  /  salmon button  /  smiling rice shell  /  Outemu (Gaote) Blue 3-pin switch</text>
  <g transform="translate(1245 37)">
    <rect width="102" height="45" rx="22.5" fill="#3F3634"/>
    <text x="51" y="19" text-anchor="middle" class="tiny" fill="#FFF9F0" style="fill:#FFF9F0">CONCEPT 01</text>
    <text x="51" y="33" text-anchor="middle" class="tiny" fill="#FFD4C4" style="fill:#FFD4C4">2D / SVG</text>
  </g>

  <!-- Hero card -->
  <rect x="42" y="126" width="824" height="535" rx="26" class="card"/>
  <text x="70" y="162" class="section">Character direction</text>
  <text x="838" y="162" text-anchor="end" class="small">salmon cap clicks down 3-4 mm</text>

  <g transform="translate(100 175)" filter="url(#shadow)">
    <!-- Rice body, three-quarter view -->
    <path d="M108 218 C112 171 167 142 282 137 C395 132 489 149 532 185
             C555 204 559 238 554 301 L548 368
             C544 413 478 443 354 447 C220 451 120 425 111 378
             C102 331 102 274 108 218Z"
          fill="url(#rice)" class="ink"/>
    <path d="M111 237 C128 275 230 298 361 293 C460 290 526 272 556 241"
          fill="none" stroke="#D9D0C4" stroke-width="2"/>
    <path d="M112 260 C150 286 242 299 354 295 L354 446 C225 451 121 425 111 378Z"
          fill="url(#grain)" opacity=".7"/>

    <!-- Salmon moving cap -->
    <path d="M72 107 C90 70 180 38 313 28 C448 18 559 39 585 76
             L556 171 C542 209 439 239 304 241 C174 243 69 220 61 181Z"
          fill="url(#salmon)" class="ink"/>
    <path d="M72 107 C146 144 491 123 585 76" fill="none" stroke="#FFB09D" stroke-width="3" opacity=".85"/>
    <path d="M146 75 C186 112 202 163 199 224" fill="none" stroke="#FFD7C7" stroke-width="15" stroke-linecap="round" opacity=".8"/>
    <path d="M262 42 C304 85 317 144 315 236" fill="none" stroke="#FFD7C7" stroke-width="17" stroke-linecap="round" opacity=".82"/>
    <path d="M393 35 C429 75 445 137 439 224" fill="none" stroke="#FFD7C7" stroke-width="16" stroke-linecap="round" opacity=".8"/>
    <path d="M506 52 C535 83 547 126 544 183" fill="none" stroke="#FFD7C7" stroke-width="13" stroke-linecap="round" opacity=".78"/>
    <path d="M80 176 C139 212 438 221 563 157 L556 181 C538 219 439 243 304 244 C174 245 68 220 61 181Z"
          fill="#D95350" opacity=".35"/>

    <!-- face -->
    <ellipse cx="260" cy="339" rx="10" ry="14" fill="#3F3634"/>
    <ellipse cx="407" cy="334" rx="10" ry="14" fill="#3F3634"/>
    <circle cx="218" cy="365" r="18" fill="#F5A7A0" opacity=".7"/>
    <circle cx="451" cy="360" r="18" fill="#F5A7A0" opacity=".7"/>
    <path d="M302 353 C322 379 354 379 374 350" fill="none" stroke="#3F3634" stroke-width="7" stroke-linecap="round"/>
    <path d="M326 372 Q339 384 352 371" fill="#F48C8B" stroke="#3F3634" stroke-width="3"/>

    <!-- press indicator -->
    <path d="M326 4 V52" class="thin" marker-end="url(#arrow)"/>
    <path d="M347 4 V52" class="thin" marker-end="url(#arrow)"/>
    <text x="337" y="-8" text-anchor="middle" class="label">PRESS!</text>
  </g>

  <!-- Hero callout pills -->
  <g transform="translate(72 582)">
    <rect width="225" height="54" rx="14" class="callout"/>
    <circle cx="27" cy="27" r="14" fill="#F57766"/><text x="27" y="31" text-anchor="middle" class="number">1</text>
    <text x="51" y="23" class="label">Whole salmon slice moves</text>
    <text x="51" y="40" class="small">broad, satisfying press target</text>
  </g>
  <g transform="translate(311 582)">
    <rect width="238" height="54" rx="14" class="callout"/>
    <circle cx="27" cy="27" r="14" fill="#F57766"/><text x="27" y="31" text-anchor="middle" class="number">2</text>
    <text x="51" y="23" class="label">Face stays on fixed shell</text>
    <text x="51" y="40" class="small">expression never gets squashed</text>
  </g>
  <g transform="translate(563 582)">
    <rect width="270" height="54" rx="14" class="callout"/>
    <circle cx="27" cy="27" r="14" fill="#F57766"/><text x="27" y="31" text-anchor="middle" class="number">3</text>
    <text x="51" y="23" class="label">Rounded pocket-friendly form</text>
    <text x="51" y="40" class="small">no sharp fins, corners, or loose parts</text>
  </g>

  <!-- Top view card -->
  <rect x="890" y="126" width="468" height="312" rx="26" class="card"/>
  <text x="918" y="162" class="section">Top view</text>
  <text x="1330" y="162" text-anchor="end" class="small">suggested envelope</text>
  <g transform="translate(951 190)">
    <path d="M15 80 C21 31 87 7 199 5 C311 3 377 29 381 78
             C385 128 318 155 201 157 C82 159 9 132 15 80Z"
          fill="url(#salmon)" class="ink" filter="url(#softShadow)"/>
    <path d="M84 25 C108 57 109 104 92 140" fill="none" stroke="#FFD7C7" stroke-width="12" stroke-linecap="round"/>
    <path d="M171 9 C196 49 197 113 177 153" fill="none" stroke="#FFD7C7" stroke-width="13" stroke-linecap="round"/>
    <path d="M263 10 C286 47 286 108 269 149" fill="none" stroke="#FFD7C7" stroke-width="13" stroke-linecap="round"/>
    <path d="M340 32 C359 64 356 105 342 132" fill="none" stroke="#FFD7C7" stroke-width="11" stroke-linecap="round"/>
    <rect x="162" y="58" width="72" height="72" rx="8" class="dash"/>
    <text x="198" y="88" text-anchor="middle" class="tiny">SWITCH</text>
    <text x="198" y="104" text-anchor="middle" class="tiny">CENTRE</text>
    <path d="M15 180 H381" class="dimension"/>
    <path d="M15 173 V187 M381 173 V187" class="dimension"/>
    <text x="198" y="199" text-anchor="middle" class="label">58 mm</text>
    <path d="M407 5 V157" class="dimension"/>
    <path d="M400 5 H414 M400 157 H414" class="dimension"/>
    <text x="424" y="85" class="label" transform="rotate(90 424 85)">34 mm</text>
  </g>

  <!-- Section card -->
  <rect x="890" y="460" width="468" height="465" rx="26" class="card"/>
  <text x="918" y="496" class="section">Section + mechanism</text>
  <text x="1330" y="496" text-anchor="end" class="small">two printed parts + switch</text>
  <g transform="translate(925 532)">
    <!-- cap in section -->
    <path d="M21 44 Q38 16 83 12 H335 Q379 16 396 44 L384 88 H33Z"
          fill="url(#salmon)" class="ink"/>
    <path d="M55 29 L76 78 M139 16 L153 83 M225 14 L231 84 M313 19 L305 82"
          stroke="#FFD7C7" stroke-width="9" stroke-linecap="round"/>
    <!-- keycap socket -->
    <path d="M183 87 V128 H224 V87" fill="#E35D56" class="ink"/>
    <path d="M197 96 V119 M188 107 H216" stroke="#FFF0E9" stroke-width="5" stroke-linecap="round"/>

    <!-- switch -->
    <rect x="165" y="126" width="78" height="64" rx="5" fill="#78A9C4" class="ink"/>
    <rect x="189" y="111" width="30" height="27" rx="3" fill="#4D87A8" class="ink"/>
    <text x="204" y="164" text-anchor="middle" class="tiny" style="fill:white">OUTEMU</text>
    <text x="204" y="178" text-anchor="middle" class="tiny" style="fill:white">BLUE</text>
    <path d="M182 190 V216 M204 190 V221 M226 190 V216" class="ink"/>

    <!-- mounting deck and shell -->
    <path d="M45 190 H144 V176 H264 V190 H364" fill="none" class="ink"/>
    <path d="M45 190 V282 Q47 313 82 322 H326 Q361 313 364 282 V190"
          fill="url(#rice)" class="ink"/>
    <path d="M144 190 V243 M264 190 V243" class="dash"/>

    <!-- face hint -->
    <circle cx="171" cy="281" r="5" fill="#3F3634"/>
    <circle cx="237" cy="281" r="5" fill="#3F3634"/>
    <path d="M187 291 Q204 306 221 291" fill="none" stroke="#3F3634" stroke-width="4" stroke-linecap="round"/>

    <!-- callouts -->
    <rect x="270" y="91" width="126" height="40" rx="8" class="mechanism-note"/>
    <path d="M270 111 H228" class="thin" marker-end="url(#arrow)"/>
    <text x="386" y="106" text-anchor="end" class="label">MX cross socket</text>
    <text x="386" y="122" text-anchor="end" class="small">built into cap</text>

    <rect x="270" y="151" width="126" height="40" rx="8" class="mechanism-note"/>
    <path d="M270 171 H264" class="thin" marker-end="url(#arrow)"/>
    <text x="386" y="166" text-anchor="end" class="label">14.0 mm opening*</text>
    <text x="386" y="182" text-anchor="end" class="small">test-coupon first</text>

    <!-- vertical dimension -->
    <path d="M6 44 V322" class="dimension"/>
    <path d="M0 44 H13 M0 322 H13" class="dimension"/>
    <text x="-12" y="190" text-anchor="middle" class="label" transform="rotate(-90 -12 190)">H 30 mm overall</text>
  </g>

  <!-- Footer -->
  <g transform="translate(42 687)">
    <rect width="824" height="238" rx="26" class="card"/>
    <text x="28" y="39" class="section">Print intent</text>

    <g transform="translate(28 64)">
      <circle cx="13" cy="13" r="13" fill="#F57766"/>
      <text x="13" y="17" text-anchor="middle" class="number">A</text>
      <text x="36" y="10" class="label">Salmon button</text>
      <text x="36" y="29" class="small">Print flat, orange/pink PLA; raised cream stripes.</text>
    </g>
    <g transform="translate(28 113)">
      <circle cx="13" cy="13" r="13" fill="#D8D0C2"/>
      <text x="13" y="17" text-anchor="middle" class="number">B</text>
      <text x="36" y="10" class="label">Rice shell</text>
      <text x="36" y="29" class="small">One-piece white body with snap-in switch deck.</text>
    </g>
    <g transform="translate(28 162)">
      <circle cx="13" cy="13" r="13" fill="#78A9C4"/>
      <text x="13" y="17" text-anchor="middle" class="number">C</text>
      <text x="36" y="10" class="label">Click engine</text>
      <text x="36" y="29" class="small">Outemu Blue, 3-pin, 50 gf; electrical pins remain unused.</text>
    </g>

    <line x1="430" y1="58" x2="430" y2="207" stroke="#E2D9CE"/>
    <text x="462" y="80" class="label">Target feel</text>
    <text x="462" y="104" class="small">Crisp click  /  controlled cap travel  /  minimal side wobble</text>
    <text x="462" y="139" class="label">Suggested first prototype</text>
    <text x="462" y="163" class="small">0.20 mm layers  /  3 walls  /  15% gyroid  /  no supports</text>
    <text x="462" y="198" class="small">*Switch opening and socket are provisional until measured against the exact switch batch.</text>
  </g>

  <text x="42" y="970" class="small">Concept only -- dimensions are design targets, not production geometry.</text>
  <text x="1358" y="970" text-anchor="end" class="small">Happy Salmon Nigiri  /  revision A</text>
</svg>
